<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="same-origin">
<title>{% block title %}Fine Print{% endblock %}</title>
<style>
:root {
  --bg: #f7f6f2; --surface: #ffffff; --ink: #1d1d1b; --muted: #5f5e58; --line: #e2e0d8;
  --accent: #2f5bd3; --bad: #b3261e; --warn: #a15c00; --ok: #2e7d32;
  --del-bg: #fde7e5; --del-ink: #8c1d18; --ins-bg: #e3f4e5; --ins-ink: #1b5e20;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141413; --surface: #1d1d1b; --ink: #ecebe6; --muted: #a7a59c; --line: #34332f;
    --accent: #8fb0ff; --bad: #ff8a80; --warn: #ffb74d; --ok: #81c784;
    --del-bg: #4a1f1c; --del-ink: #ffcdc8; --ins-bg: #1d3b22; --ins-ink: #c8f0cc;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: var(--accent); }
a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
header.site { border-bottom: 1px solid var(--line); background: var(--surface); }
header.site .wrap { display: flex; gap: 1rem; align-items: baseline; justify-content: space-between; flex-wrap: wrap; }
header.site a.brand { font-weight: 700; text-decoration: none; color: var(--ink); font-size: 1.15rem; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 1rem; }
h1 { font-size: 1.6rem; margin: .5rem 0; }
h2 { font-size: 1.15rem; margin: 1.75rem 0 .75rem; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem; }
.grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
th, td { text-align: left; padding: .6rem .75rem; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.table-scroll { overflow-x: auto; }
.badge { display: inline-block; padding: .1rem .45rem; border-radius: 999px; font-size: .75rem; border: 1px solid var(--line); color: var(--muted); margin: 0 .2rem .2rem 0; white-space: nowrap; }
.badge.on { border-color: var(--accent); color: var(--accent); }
.badge.off { opacity: .55; text-decoration: line-through; }
.grade { font-weight: 700; display: inline-block; min-width: 1.8rem; text-align: center; border-radius: 6px; border: 1px solid var(--line); }
.sev { font-weight: 600; }
.sev.high { color: var(--bad); } .sev.mid { color: var(--warn); } .sev.low { color: var(--ok); }
.bar { height: .55rem; border-radius: 999px; background: var(--line); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); }
.diff { display: grid; gap: 1rem; grid-template-columns: 1fr 1fr; }
@media (max-width: 720px) { .diff { grid-template-columns: 1fr; } }
.diff pre { white-space: pre-wrap; word-wrap: break-word; font: inherit; margin: 0; }
del { background: var(--del-bg); color: var(--del-ink); text-decoration: line-through; }
ins { background: var(--ins-bg); color: var(--ins-ink); text-decoration: none; }
blockquote { margin: .5rem 0; padding-left: .75rem; border-left: 3px solid var(--line); }
.swarm { list-style: none; margin: 0; padding: 0; max-height: 16rem; overflow-y: auto; }
.swarm li { display: flex; gap: .5rem; padding: .3rem 0; border-bottom: 1px dashed var(--line); font-size: .875rem; flex-wrap: wrap; }
.swarm .role { font-weight: 600; text-transform: capitalize; min-width: 5.5rem; }
.swarm .ev { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.live { display: inline-block; width: .55rem; height: .55rem; border-radius: 50%; background: var(--muted); margin-right: .35rem; }
.live.on { background: var(--ok); }
footer { margin: 2rem 0 1rem; }
button { font: inherit; padding: .4rem .8rem; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
</style>
</head>
<body>
<header class="site"><div class="wrap">
  <a class="brand" href="/">Fine Print</a>
  <nav class="small">{% block nav %}<a href="/">Terms Radar</a>{% endblock %}</nav>
</div></header>
<main class="wrap">
{% block content %}{% endblock %}
<footer class="small muted"><em>Information, not legal advice.</em></footer>
</main>
{% block scripts %}{% endblock %}
</body>
</html>
