[project]
name = "fine-print"
version = "0.1.0"
description = "Fine Print: a personal agent that watches the legal fine print you agree to"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic>=2.14.4",
    "pydantic-ai-slim[openai]>=2.75.0",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.34",
    "tldextract>=5.4.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "python-docx>=1.2.0",
    "respx>=0.23.1",
    "ruff>=0.17.6",
]
workers = [
    "playwright>=1.65.2",
    "python-docx>=1.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
